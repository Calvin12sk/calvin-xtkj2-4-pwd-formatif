<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak - Formatif 4</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        #contact {
            padding: 50px 20px;
        }

        .contact-form {
            width: 400px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #1e3a8a;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .contact-form h2 {
            text-align: center;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f8fafc;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background-color: #e2e8f0;
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .btn-submit {
            background-color: #1e3a8a;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        footer {
            text-align: center;
            margin-top: 35px;
        }

        footer a {
            color: navy;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <section id="contact">
            <form class="contact-form">
                <h2>Hubungi Saya</h2>

                <div class="form-group">
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name" placeholder="Masukkan nama Anda">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda">
                </div>

                <div class="form-group">
                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tuliskan pesan Anda"></textarea>
                </div>

                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <footer>
        <a href="../index.html">← Kembali ke Beranda</a>
    </footer>
</body>
</html>
