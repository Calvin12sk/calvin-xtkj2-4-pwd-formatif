<!-- 
Hitungan lebar kartu jika box-sizing tidak diatur (content-box):
Lebar Total = width (320px) + padding-left (20px) + padding-right (20px) + border-left (2px) + border-right (2px)
Lebar Total = 320px + 20px + 20px + 2px + 2px = 364px
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek - Formatif 4</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #1e3a8a;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            color: #0f172a;
            margin-top: 16px;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .card p {
            font-size: 15px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .card a {
            font-size: 15px;
            color: #d97706;
            font-weight: bold;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-top: 40px;
        }

        footer a {
            color: navy;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/proyek1.jpg" alt="Website Toko Online">
            <h3>Website Toko Online</h3>
            <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">← Kembali ke Beranda</a>
    </footer>
</body>
</html>
